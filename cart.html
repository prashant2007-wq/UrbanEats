<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanEats | Cart</title>
  <link rel="stylesheet" href="cart.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="header-content">
      <h1>UrbanEats</h1>
      <button id="toggleBtn" class="theme-toggle">
        <span class="toggle-slider"></span>
        <span class="toggle-text">Dark</span>
      </button>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="favourites.html">Favourites</a>
      <a href="cart.html" class="active">Cart</a>
      <a href="track.html">Track Order</a>
      <a href="login.html">Login</a>
    </nav>
  </header>

  <main>
    <div class="cart-box">
      <h2>🛒 Order Summary</h2>
      <table>
        <thead>
          <tr>
            <th>Item</th>
            <th>Quantity</th>
            <th>Price</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>Margherita Pizza</td>
            <td>1</td>
            <td>₹250</td>
          </tr>
          <tr>
            <td>Delivery Fee</td>
            <td>-</td>
            <td>₹30</td>
          </tr>
          <tr>
            <td>Total</td>
            <td>-</td>
            <td>₹280</td>
          </tr>
        </tbody>
      </table>

      <form id="checkoutForm">
        <fieldset>
          <legend>Checkout Details</legend>
          <input type="text" name="name" placeholder="Full Name" required>
          <input type="text" name="address" placeholder="Delivery Address" required>
          <input type="tel" name="phone" placeholder="Phone Number" required>
          <input type="submit" value="Place Order">
        </fieldset>
      </form>
    </div>
  </main>

  <footer>
    <p>
      Follow UrbanEats – 
      <a href="https://www.instagram.com/urbaneats/" target="_blank">Instagram</a> |
      <a href="https://www.facebook.com/urbaneat/" target="_blank">Facebook</a> |
      <a href="https://x.com/feasturbaneats?lang=en" target="_blank">Twitter</a>
    </p>
    <p>&copy; 2025 UrbanEats. All rights reserved.</p>
  </footer>

  <script src="cart.js"></script>
</body>
</html>

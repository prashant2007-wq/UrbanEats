<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UrbanEats | Login</title>
  <link rel="stylesheet" href="login.css">
  <meta name="google-signin-client_id" content="YOUR_GOOGLE_CLIENT_ID"> <!-- Replace with your actual Google Client ID -->
</head>
<body>
  <header>
    <h1>UrbanEats</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="favourites.html">Favourites</a>
      <a href="cart.html">Cart</a>
      <a href="track.html">Track Order</a>
      <a href="login.html" class="active">Login</a>
    </nav>
  </header>

  <main>
    <form id="loginForm">
      <fieldset>
        <legend>Login</legend>
        <input type="email" id="loginEmail" placeholder="Email" required>
        <input type="password" id="loginPassword" placeholder="Password" required>
        <input type="submit" value="Login">
      </fieldset>
    </form>

    <form id="signupForm">
      <fieldset>
        <legend>Sign Up</legend>
        <input type="text" id="signupName" placeholder="Full Name" required>
        <input type="email" id="signupEmail" placeholder="Email" required>
        <input type="password" id="signupPassword" placeholder="Password" required>
        <input type="submit" value="Sign Up">
      </fieldset>
    </form>

    <div id="googleSignIn">
      <p>Or sign in with Google:</p>
      <div id="gSignInButton"></div>
      <button id="gSignOutButton" style="display: none;">Sign Out</button>
    </div>

    <div id="statusMessage" style="display: none; margin-top: 20px; text-align: center;"></div>
  </main>

  <footer>
    <p>&copy; 2025 UrbanEats | All rights reserved.</p>
  </footer>

  <script src="https://apis.google.com/js/platform.js" async defer></script>
  <script src="login.js"></script>
</body>
</html>

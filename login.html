<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UrbanEats | Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #0a0a0a, #1e1e1e);
      color: #f0f0f0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      align-items: center;
    }

    /* HEADER */
    header {
      background: rgba(0, 0, 0, 0.85);
      color: #00ccbc;
      text-align: center;
      padding: 20px 0;
      width: 100%;
      box-shadow: 0 0 20px rgba(0, 204, 188, 0.2);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 1000;
      animation: fadeInDown 0.8s ease;
    }

    header h1 {
      margin: 0 0 10px 0;
      font-size: 2.3em;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0, 204, 188, 0.6);
    }

    /* NAVIGATION BAR */
    nav {
      display: flex;
      justify-content: center;
      gap: 40px;
      flex-wrap: wrap;
    }

    nav a {
      position: relative;
      color: #f5f5f5;
      text-decoration: none;
      font-weight: 500;
      font-size: 1.05em;
      transition: color 0.3s ease;
    }

    nav a::after {
      content: '';
      position: absolute;
      left: 0;
      bottom: -6px;
      width: 100%;
      height: 2px;
      background-color: #00ccbc;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.3s ease;
    }

    nav a:hover::after,
    nav a.active::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    nav a:hover,
    nav a.active {
      color: #00ccbc;
      text-shadow: 0 0 10px #00ccbc;
    }

    /* MAIN CONTENT */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 60px 20px;
      gap: 50px;
      animation: fadeIn 1s ease;
    }

    form {
      width: 340px;
      padding: 30px 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    form:hover {
      transform: translateY(-6px);
      box-shadow: 0 0 25px rgba(0, 204, 188, 0.4);
    }

    legend {
      font-weight: 600;
      font-size: 1.3em;
      text-align: center;
      color: #00ccbc;
      margin-bottom: 10px;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 10px auto 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 0.95em;
      display: block;
      transition: border 0.3s, background 0.3s;
    }

    input::placeholder {
      color: #aaa;
    }

    input:focus {
      outline: none;
      border-color: #00ccbc;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 8px rgba(0, 204, 188, 0.3);
    }

    input[type="submit"] {
      background-color: #00ccbc;
      color: #000;
      border: none;
      font-weight: 600;
      cursor: pointer;
      padding: 10px 0;
      width: 65%;
      margin: 10px auto 0;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    input[type="submit"]:hover {
      background-color: #00e5d0;
      box-shadow: 0 0 12px #00ccbc;
      transform: translateY(-2px);
    }

    footer {
      width: 100%;
      font-size: 0.9em;
      color: #aaa;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 20px 0;
      text-align: center;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      nav {
        gap: 20px;
      }
      form {
        width: 90%;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>UrbanEats</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="favourites.html">Favourites</a>
      <a href="cart.html">Cart</a>
      <a href="track.html">Track Order</a>
      <a href="login.html" class="active">Login</a>
    </nav>
  </header>

  <main>
    <form>
      <fieldset>
        <legend>Login</legend>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <input type="submit" value="Login">
      </fieldset>
    </form>

    <form>
      <fieldset>
        <legend>Sign Up</legend>
        <input type="text" placeholder="Full Name" required>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <input type="submit" value="Sign Up">
      </fieldset>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 UrbanEats | All rights reserved.</p>
  </footer>

</body>
</html>
